org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Some Android/Kotlin plugin artifacts are tens of megabytes. The default
# network timeout is too short on slower links and leaves partial Gradle cache
# entries, so allow dependency downloads enough time to finish reliably.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
android.useAndroidX=true
android.nonTransitiveRClass=true
android.namespaceMode=legacy
